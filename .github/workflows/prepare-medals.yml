name: Prepare authentic medal imagery
on:
  push:
    branches: [design/real-medal-assets-v14]
    paths:
      - scripts/prepare_awards_assets.py
      - .github/workflows/prepare-medals.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-source-medals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install award-processing dependencies
        run: python -m pip install --disable-pip-version-check "numpy<3" pillow "opencv-python-headless<5" requests
      - name: Download originals and process transparent source artwork
        run: python scripts/prepare_awards_assets.py
      - name: Upload source-to-transparent comparison for design QA
        uses: actions/upload-artifact@v4
        with:
          name: processed-medal-comparison
          path: tmp/medal-review/
          retention-days: 7
      - name: Commit true transparent medal assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/awards/
          if ! git diff --cached --quiet; then
            git commit -m "assets: commit transparent restored medals from official source"
            git push origin HEAD:design/real-medal-assets-v14
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install site dependencies
        run: npm ci --no-audit --no-fund
      - name: Build all localized pages
        run: npm run build
      - name: Verify exported pages and original award assets
        run: npm run check:ui
      - name: Export gallery preview for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: v14-artifact-preview
          retention-days: 3
          path: |
            out/vi/company/cacdanhhieu/
            out/ru/company/healthcare/
            out/vi/company/linhvuc/
            out/ru/company/activity/
            out/en/company/activity/
            out/ru/company/environment/
            out/awards/
            out/brand/
            out/_next/static/css/
