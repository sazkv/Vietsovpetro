name: Inspect official VSP menu URLs
on:
  push:
    branches: [design/employee-bar-museum-stage-hero-v15]
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - name: Read canonical website anchors
        run: |
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          class Inspector(HTMLParser):
           def __init__(self):
            super().__init__()
            self.links=[]
            self.curr=None
           def handle_starttag(self,tag,attrs):
            if tag=="a":
             self.curr={"attrs":dict(attrs),"text":""}
             self.links.append(self.curr)
           def handle_data(self,data):
            if self.curr:self.curr["text"]+=data
           def handle_endtag(self,tag):
            if tag=="a":self.curr=None
          request=urllib.request.Request("https://www.vietsov.com.vn/Pages/default.aspx",headers={"User-Agent":"Mozilla/5.0"})
          html=urllib.request.urlopen(request,timeout=30).read().decode("utf-8","replace")
          doc=Inspector();doc.feed(html)
          tokens=["Sign In","Đăng nhập","Certificate","Lịch Tàu","Lich Tau","Lịch Bay","Cẩm nang","eOffice","Liên kết"]
          print("HTTP OK, bytes:",len(html),"anchors:",len(doc.links))
          for item in doc.links:
           txt=" ".join(item["text"].split())
           if any(k.lower() in txt.lower() for k in tokens):
            print(repr(txt[:130]),repr(item["attrs"]))
          PY
