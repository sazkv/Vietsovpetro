name: V15 Layout Preflight
on:
  push:
    branches:
      - design/employee-bar-museum-stage-hero-v15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:structure
      - name: Export 2376 pages
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Vietsovpetro
          NEXT_PUBLIC_SITE_URL: https://sazkv.github.io/Vietsovpetro
      - run: npm run check:ui
      - name: Install browser for real rendered visual checks
        run: |
          npm install --no-save --no-audit playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test EN/VI line breaks, utility links and actual medal interactions
        run: node scripts/qa-v15.mjs
      - name: Upload desktop / mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-browser-layout-preview
          path: tmp/qa-v15/*.png
          if-no-files-found: ignore
          retention-days: 7
